<header>
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Chobe home"
      ><img src="/brand/chobe-logo.svg" alt="Chobe" width="132" height="40"
    /></a>
    <nav aria-label="Shop navigation">
      <a routerLink="/categories">Categories</a>
      <a routerLink="/account/followed-shops" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Following</a
      >
      <a routerLink="/seller/shop" routerLinkActive="active" ariaCurrentWhenActive="page"
        >My shop</a
      >
      @if (auth.user()) {
        <a routerLink="/account/profile">My account</a>
      } @else {
        <a routerLink="/login">Log in</a>
      }
      <a routerLink="/search">Find items</a>
      <a routerLink="/seller/listings">My listings</a>
    </nav>
  </div>
</header>
