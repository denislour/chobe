[project]
name = "chobe-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.2",
    "django-unfold>=0.108.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations/*.py"]
